tight_lio_node:
  ros__parameters:
    T_imu_lidar_translation: [0.0, 0.0, 0.0]
    T_imu_lidar_rotation: [1.0, 0.0, 0.0, 0.0]
    imu_acc_noise: 0.01
    imu_gyro_noise: 0.001
    imu_acc_bias_noise: 0.0001
    imu_gyro_bias_noise: 0.00001
    imu_init_samples: 200
    use_msg_orientation_init: false
    initial_yaw_offset_deg: 0.0
    trajectory_yaw_offset_deg: 180.0
    measurement_noise_std: 0.20
    iekf_max_iterations: 2
    iekf_max_residuals: 60
    iekf_startup_scans: 40
    iekf_residual_gate_m: 0.30
    iekf_max_translation_step_m: 0.03
    iekf_max_velocity_step_mps: 0.12
    iekf_max_rotation_step_rad: 0.015
    max_position_jump_m: 2.0
    max_velocity_jump_mps: 3.0
    max_abs_velocity_mps: 10.0
    iekf_convergence_threshold: 0.001
    iekf_min_points_for_update: 80
    icp_num_neighbors: 20
    icp_plane_valid_threshold: 0.5
    icp_max_correspondence_dist: 0.3
    icp_min_points_for_update: 50
    map_voxel_size: 0.3 
    map_publish_voxel_size: 0.5
    enable_map_publish: false
    safe_mode: false
    max_points_per_scan: 2500
    lidar_topic: "/ouster_points"
    imu_topic: "/imu/data"
    world_frame: "world"
    imu_frame: "imu"
    lidar_frame: "ouster"